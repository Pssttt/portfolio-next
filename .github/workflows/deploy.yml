name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: Bust build cache (clean rebuild)
        type: boolean
        default: false

env:
  OWNER: pssttt
  IMAGE: portfolio-next

jobs:
  gitops:
    name: Check GitOps credentials
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.g.outputs.present }}
    steps:
      - id: g
        env:
          APP_ID: ${{ secrets.GITOPS_APP_ID }}
          APP_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GITOPS_APP_ID / GITOPS_APP_PRIVATE_KEY not set -- image will be published but the GitOps tag write-back is skipped."
          fi

  build:
    name: Build & push image
    needs: gitops
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: ${{ inputs.no_cache == true }}
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE }}:latest
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Write image tag to GitOps repo
    needs: [gitops, build]
    if: needs.gitops.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: gitops-write-back-portfolio
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: unishare-oss
          repositories: k8s-practice

      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: unishare-oss/k8s-practice
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Update image tag
        working-directory: gitops
        env:
          SHA: ${{ github.sha }}
          F: portfolio-chart/values.yaml
        run: |
          set -euo pipefail
          TAG="sha-${SHA}"

          if [ ! -f "$F" ]; then
            echo "::error::${F} does not exist in the GitOps repo -- nothing to deploy into."
            exit 1
          fi

          yq -i ".image.web.tag = \"${TAG}\"" "$F"
          echo "--- resulting image block ---"
          yq '.image' "$F"

      - name: Commit and publish
        working-directory: gitops
        env:
          SHA: ${{ github.sha }}
          F: portfolio-chart/values.yaml
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No tag change (this commit is already deployed) -- nothing to do."
            exit 0
          fi
          git config user.name  "unishare-ci[bot]"
          git config user.email "unishare-ci[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "deploy: portfolio @ ${SHA:0:7}"
          git -c push.default=current push origin HEAD:main || {
            echo "rejected -- rebasing onto latest main and retrying once"
            git pull --rebase origin main
            git -c push.default=current push origin HEAD:main
          }
